name: Order alerts
  
on:
  schedule:
    # Every 10 minutes from 9:00 AM to 11:00 PM IST.
    # GitHub cron uses UTC, and IST is UTC+5:30.
    - cron: "30,40,50 3 * * *"          # 9:00-9:50 AM IST
    - cron: "0,10,20,30,40,50 4-16 * * *" # 9:50 AM-10:50 PM IST
    - cron: "0,10,20,30 17 * * *"      # 10:50-11:00 PM IST
  workflow_dispatch:

permissions:
  contents: write      # needed to save seen_orders.json back to the repo

concurrency:
  group: order-alerts
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - run: playwright install --with-deps chromium

      - name: Check for new orders
        env:
          SL_USER: ${{ secrets.SL_USER }}
          SL_PASS: ${{ secrets.SL_PASS }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_IDS: ${{ secrets.TG_CHAT_IDS }}
        run: python order_alerts.py

      - name: Upload debug screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug
          path: debug.png
          retention-days: 1
          if-no-files-found: ignore

      - name: Save seen orders
        if: always()
        run: |
          git config user.name "order-alerts-bot"
          git config user.email "order-alerts-bot@users.noreply.github.com"
          git add seen_orders.json || true
          git diff --cached --quiet || (git commit -m "Update seen orders" && git push)
